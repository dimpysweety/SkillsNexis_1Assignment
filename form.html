<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form - Week 1 HTML Basics</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Week 1 - HTML Basics Assignment</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="table.html">Student Table</a>
    <a href="form.html" class="active">Registration Form</a>
  </nav>

  <main>
    <h2>Student Registration Form</h2>
    <form action="#" method="post">

      <div>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
      </div>

      <div>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div>
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="1" max="100" placeholder="Enter your age">
      </div>

      <div>
        <label for="course">Select Course</label>
        <select id="course" name="course">
          <option value="">-- Choose a course --</option>
          <option value="web-dev">Web Development</option>
          <option value="python">Python Programming</option>
          <option value="data-science">Data Science</option>
          <option value="app-dev">App Development</option>
        </select>
      </div>

      <button type="submit">Submit Registration</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 My Web Dev Internship - Skillsnexis</p>
  </footer>

</body>
</html>
